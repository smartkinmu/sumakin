<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ログ表示</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px 6px 20px;
        }
        .topbar .icon-btn {
            width: 36px;
            height: 36px;
            min-width: 36px;
            flex: none;
            padding: 0;
            background: var(--surface-muted);
            color: var(--text);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .topbar .icon-btn.danger { color: var(--danger); }
        .topbar h1 {
            font-size: 1.176rem;
            font-weight: 700;
            margin: 0;
            flex-grow: 1;
        }
        /* flexコンテナ内だとSafariでネイティブのmonth入力欄が崩れるため
           ブロックレイアウト(縦積み)にする */
        .month-row {
            display: block;
        }
        .month-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
        }
        .month-row input[type="month"] {
            display: block;
            width: 100%;
            box-sizing: border-box;
            border: none;
            background: var(--surface-muted);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 0.941rem;
            color: var(--text);
        }
        .stat-row {
            display: flex;
            gap: 8px;
        }
        .stat-tile {
            flex: 1;
            background: var(--accent-soft);
            border-radius: var(--radius-md);
            padding: 11px 12px;
        }
        .stat-tile .stat-label {
            font-size: 0.706rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .stat-tile .stat-value {
            font-size: 1.176rem;
            font-weight: 800;
            color: var(--text);
        }
        .stat-tile .stat-unit {
            font-size: 0.765rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        #log-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .log-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
        }
        .log-card .log-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .log-card .log-date {
            font-size: 0.941rem;
            font-weight: 700;
        }
        .log-card .log-dow {
            font-size: 0.765rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 6px;
        }
        .log-card .mail-mark {
            display: inline-flex;
            vertical-align: middle;
            margin-left: 7px;
            color: var(--accent);
        }
        .log-card .edit-btn {
            width: 30px;
            height: 30px;
            min-width: 30px;
            padding: 0;
            background: var(--surface-muted);
            border-radius: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.882rem;
            box-shadow: none;
        }
        .log-card .log-mid {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .log-card .log-times {
            font-size: 0.824rem;
            color: var(--text-muted);
        }
        .log-card .chip {
            font-size: 0.765rem;
            font-weight: 700;
            color: var(--text);
            background: var(--surface-muted);
            border-radius: 8px;
            padding: 4px 9px;
            margin-left: auto;
        }
        .log-card .chip.overtime {
            color: var(--overtime-text);
            background: var(--overtime-bg);
        }
        /* 残業がマイナス（勤務時間が不足）の場合は赤で示す。プラスと同じ重みにする */
        .log-card .chip.short {
            color: var(--short-text);
            background: var(--short-bg);
        }
        .log-card .log-sub {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            font-size: 0.765rem;
            color: var(--text-muted);
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.882rem;
            padding: 30px 0;
        }
        dialog#edit-dialog {
            border: none;
            border-radius: var(--radius-lg);
            padding: 18px;
            background: var(--surface);
            color: var(--text);
            width: min(320px, 90vw);
        }
        dialog#edit-dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
        }
        /* flexコンテナ内だとSafariでネイティブのdate/time入力欄が崩れるため
           ブロックレイアウト(縦積み)にする */
        #edit-form {
            display: block;
        }
        #edit-form > * {
            margin-top: 12px;
        }
        #edit-form > *:first-child {
            margin-top: 0;
        }
        #edit-form .input-group label {
            display: block;
            margin-bottom: 6px;
        }
        #edit-form .input-group input {
            width: 100%;
        }
        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .edit-actions button {
            flex: 1;
            padding: 10px 0;
        }
        #edit-delete {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }
        #edit-cancel {
            background: var(--surface-muted);
            color: var(--text);
        }
    </style>
</head>
<body>
    <div id="refresh-indicator">更新中...</div>
    <div class="topbar">
        <a href="index.html" class="icon-btn" aria-label="戻る">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>ログ表示</h1>
        <button id="refresh-button" class="icon-btn" aria-label="更新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
        <button id="download-logs" class="icon-btn" aria-label="CSVダウンロード">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 19h14"/></svg>
        </button>
        <button id="clear-logs" class="icon-btn danger" aria-label="ログをクリア">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg>
        </button>
        <button id="undo-delete-btn" class="icon-btn" aria-label="UNDO">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
    </div>

    <div class="container">
        <div class="card month-row">
            <label for="summary-month">集計対象年月</label>
            <input type="month" id="summary-month">
        </div>

        <div class="stat-row">
            <div class="stat-tile">
                <div class="stat-label">勤務日数</div>
                <div class="stat-value" id="stat-days">-<span class="stat-unit"> 日</span></div>
            </div>
            <div class="stat-tile">
                <div class="stat-label">合計時間</div>
                <div class="stat-value" id="stat-hours">-<span class="stat-unit">h</span></div>
            </div>
            <div class="stat-tile">
                <div class="stat-label">残業</div>
                <div class="stat-value" id="stat-overtime">-<span class="stat-unit">h</span></div>
            </div>
        </div>
        <p id="monthly-summary" style="display:none;"></p>

        <div id="log-body"></div>
    </div>

    <dialog id="edit-dialog" tabindex="-1">
        <form method="dialog" id="edit-form">
            <div class="input-group">
                <label for="edit-date">日付</label>
                <input type="date" id="edit-date">
            </div>
            <div class="input-group">
                <label for="edit-start">始業</label>
                <input type="time" id="edit-start">
            </div>
            <div class="input-group">
                <label for="edit-end">終業</label>
                <input type="time" id="edit-end">
            </div>
            <div class="edit-actions">
                <button id="edit-save" type="submit">保存</button>
                <button id="edit-delete" type="button">削除</button>
                <button id="edit-cancel" type="button">キャンセル</button>
            </div>
        </form>
    </dialog>
    <script src="common.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const logBody = document.getElementById('log-body');
        const summaryMonth = document.getElementById('summary-month');
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        summaryMonth.value = `${now.getFullYear()}-${month}`;
        // 「更新」ボタンと画面を下に引く操作で、キャッシュを消して最新版を取得する
        document.getElementById('refresh-button').addEventListener('click', refreshApp);
        setupPullToRefresh();
        // date/time入力欄の実際のpx幅を測定して明示指定する（Safari対策）
        fixNativeInputWidths();
        window.addEventListener('resize', () => fixNativeInputWidths());
        const editDialog = document.getElementById('edit-dialog');
        const editDate = document.getElementById('edit-date');
        const editStart = document.getElementById('edit-start');
        const editEnd = document.getElementById('edit-end');
        const editSave = document.getElementById('edit-save');
        const editCancel = document.getElementById('edit-cancel');
        const editDelete = document.getElementById('edit-delete');
        const undoBtn = document.getElementById('undo-delete-btn');
        let originalDate = '';

        /**
         * UNDOボタンの有効/無効を、復元可能なデータの有無に応じて切り替える。
         * @returns {void}
         */
        function updateUndoState() {
            undoBtn.disabled = localStorage.getItem('logs_undo') === null;
        }
        updateUndoState();

        /**
         * Delete record of specified date.
         * @param {string} date - YYYY-MM-DD
         * @returns {boolean} Deletion result
         */
        function deleteLogByDate(date) {
            const logsStr = restoreLogsIfNeeded();
            if (!logsStr) {
                alert("ログはありません");
                return false;
            }
            const lines = logsStr.split("\n").filter(line => line);
            const remaining = [];
            let found = false;
            lines.forEach(line => {
                const [d] = line.split(",");
                if (d === date) {
                    found = true;
                } else {
                    remaining.push(line);
                }
            });
            if (!found) {
                alert("指定した日付のデータはありません");
                return false;
            }
            if (!confirm(`${date} のログを削除しますか？`)) {
                return false;
            }
            localStorage.setItem('logs_undo', logsStr);
            if (remaining.length > 0) {
                const updated = remaining.join("\n");
                localStorage.setItem('logs', updated);
                localStorage.setItem('logs_backup', updated);
            } else {
                localStorage.removeItem('logs');
                localStorage.removeItem('logs_backup');
            }
            return true;
        }

        /**
         * Undo the last save/delete/edit action.
         * logs_undo は index.html の「登録」によるログ上書き、
         * および logs.html 上での削除・編集操作の直前の状態を保持する。
         * @returns {void}
         */
        function undoDelete() {
            const backup = localStorage.getItem('logs_undo');
            if (backup === null) {
                alert("元に戻せる操作はありません");
                return;
            }
            const current = localStorage.getItem('logs') || '';
            const changes = buildUndoPreview(current, backup);
            const message = changes.length > 0
                ? `以下の内容が変更されます。\n\n${changes.join('\n')}\n\n元に戻しますか？`
                : "元に戻しますか？";
            if (!confirm(message)) {
                return;
            }
            if (backup === '') {
                localStorage.removeItem('logs');
                localStorage.removeItem('logs_backup');
            } else {
                localStorage.setItem('logs', backup);
                localStorage.setItem('logs_backup', backup);
            }
            localStorage.removeItem('logs_undo');
            updateSummary();
        }

        /**
         * Update a log record.
         * @param {string} oldDate - existing date in YYYY-MM-DD
         * @param {string} newDate - new date
         * @param {string} start - start time HH:MM
         * @param {string} end - end time HH:MM
         * @returns {boolean} Update result
         */
        function updateLog(oldDate, newDate, start, end) {
            const logsStr = restoreLogsIfNeeded();
            if (!logsStr) {
                alert('ログはありません');
                return false;
            }
            const lines = logsStr.split('\n').filter(line => line);
            let found = false;
            for (let i = 0; i < lines.length; i++) {
                const [d] = lines[i].split(',');
                if (d === oldDate) {
                    const work = calculateWorkingHours(start, end);
                    const overtime = (parseFloat(work) - 7.75).toFixed(2);
                    // 中断時間とメール作成済みの記録は編集で失わないよう引き継ぐ
                    const kept = lines[i].split(',');
                    lines[i] = [newDate, start, end, work, overtime,
                        kept[5] || '', kept[6] || '', kept[7] || '', kept[8] || '',
                        kept[MAILED_INDEX] || ''].join(',');
                    found = true;
                    break;
                }
            }
            if (!found) {
                alert('指定した日付のデータはありません');
                return false;
            }
            localStorage.setItem('logs_undo', logsStr);
            const updated = lines.join('\n');
            localStorage.setItem('logs', updated);
            localStorage.setItem('logs_backup', updated);
            return true;
        }

        /**
         * Show edit dialog for a log record without opening the date picker.
         * @param {string} date - existing date in YYYY-MM-DD
         * @param {string} start - start time HH:MM
         * @param {string} end - end time HH:MM
         * @returns {void}
         */
        function openEditDialog(date, start, end) {
            originalDate = date;
            editDate.value = date;
            if (start === '年休') {
                // 年休はデフォルト時間を入力欄に設定する
                editStart.value = '08:30';
                editEnd.value = '17:15';
            } else {
                editStart.value = start;
                editEnd.value = end;
            }
            const originalType = editDate.type;
            // 一時的に text 型へ変更しフォーカス時のピッカー表示を抑制
            editDate.type = 'text';
            editDialog.showModal();
            editDate.type = originalType;
            fixNativeInputWidths(editDialog);
        }
        /**
         * Create table row for a log record with edit option.
         * @param {string} date - YYYY-MM-DD
         * @param {string} start - start time
         * @param {string} end - end time
         * @param {string} work - working hours
         * @param {string} overtime - overtime hours
         * @returns {DocumentFragment} Created rows
         */

        function createRow(date, start, end, work, overtime, b1s, b1e, b2s, b2e, mailed) {
            const card = document.createElement('div');
            card.className = 'log-card';

            const top = document.createElement('div');
            top.className = 'log-top';

            const dateWrap = document.createElement('div');
            const dateWithDay = formatDateWithDay(date);
            const dowMatch = dateWithDay.match(/^(.*)(\(.\))$/);
            const dateSpan = document.createElement('span');
            dateSpan.className = 'log-date';
            dateSpan.textContent = dowMatch ? dowMatch[1] : dateWithDay;
            dateWrap.appendChild(dateSpan);
            if (mailed) {
                // メール作成済みの目印（登録だけの日と区別するため）
                const mailMark = document.createElement('span');
                mailMark.className = 'mail-mark';
                mailMark.title = 'メール作成済み';
                mailMark.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>';
                dateSpan.appendChild(mailMark);
            }
            if (dowMatch) {
                const dowSpan = document.createElement('span');
                dowSpan.className = 'log-dow';
                dowSpan.textContent = dowMatch[2];
                dateWrap.appendChild(dowSpan);
            }
            top.appendChild(dateWrap);

            const editBtn = document.createElement('button');
            editBtn.textContent = '✎';
            editBtn.title = '編集';
            editBtn.className = 'edit-btn';
            editBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                openEditDialog(date, start, end);
            });
            top.appendChild(editBtn);
            card.appendChild(top);

            const mid = document.createElement('div');
            mid.className = 'log-mid';
            const times = document.createElement('span');
            times.className = 'log-times';
            times.textContent = `${start} → ${end}`;
            mid.appendChild(times);

            const workChip = document.createElement('span');
            workChip.className = 'chip';
            workChip.textContent = `${work}h`;
            mid.appendChild(workChip);

            const overtimeNum = parseFloat(overtime) || 0;
            if (overtimeNum !== 0) {
                const overtimeChip = document.createElement('span');
                overtimeChip.className = overtimeNum > 0 ? 'chip overtime' : 'chip short';
                overtimeChip.textContent = overtimeNum > 0 ? `+${overtime}h` : `${overtime}h`;
                mid.appendChild(overtimeChip);
            }
            card.appendChild(mid);

            if (b1s && b1e) {
                const sub = document.createElement('div');
                sub.className = 'log-sub';
                sub.textContent = `中断(1) ${b1s}–${b1e}（${durationHours(b1s, b1e)}h）`;
                card.appendChild(sub);
            }
            if (b2s && b2e) {
                const sub = document.createElement('div');
                sub.className = 'log-sub';
                sub.textContent = `中断(2) ${b2s}–${b2e}（${durationHours(b2s, b2e)}h）`;
                card.appendChild(sub);
            }
            return card;
        }

        function renderEmptyState() {
            logBody.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'empty-state';
            div.textContent = 'ログはありません';
            logBody.appendChild(div);
        }

        const data = restoreLogsIfNeeded();
        if (data) {
            const daily = {};
            const lines = [];
            data.split('\n').forEach(line => {
                if (!line) return;
                const parsed = parseLogLine(line);
                if (!parsed) return;
                const parts = parsed.split(',');
                const date = parts[0];
                const start = parts[1];
                const end = parts[2];
                const work = parts[3];
                const overtime = parts[4];
                const b1s = parts[5] || '';
                const b1e = parts[6] || '';
                const b2s = parts[7] || '';
                const b2e = parts[8] || '';
                const mailed = parts[MAILED_INDEX] || '';
                daily[date] = { start, end, work, overtime, b1s, b1e, b2s, b2e, mailed };
                lines.push(parsed);
            });
            if (lines.length > 0) {
                localStorage.setItem('logs', lines.join('\n'));
            } else {
                localStorage.removeItem('logs');
            }
            Object.keys(daily).sort().forEach(date => {
                const { start, end, work, overtime, b1s, b1e, b2s, b2e, mailed } = daily[date];
                const card = createRow(date, start, end, work, overtime, b1s, b1e, b2s, b2e, mailed);
                logBody.appendChild(card);
            });
        } else {
            renderEmptyState();
        }

        document.getElementById('clear-logs').addEventListener('click', function () {
            if (confirm('ログをクリアしますか？')) {
                localStorage.removeItem('logs');
                renderEmptyState();
                updateSummary();
            }
        });
        document.getElementById('download-logs').addEventListener('click', downloadLogs);
        document.getElementById("undo-delete-btn").addEventListener("click", undoDelete);

        editCancel.addEventListener('click', function () {
            editDialog.close();
        });

        editDelete.addEventListener('click', function () {
            if (deleteLogByDate(originalDate)) {
                editDialog.close();
                updateSummary();
            }
        });

        editSave.addEventListener('click', function (e) {
            e.preventDefault();
            const newDate = editDate.value;
            const newStart = editStart.value;
            const newEnd = editEnd.value;
            if (!newDate || !newStart || !newEnd) {
                alert('日付と時刻を入力してください');
                return;
            }
            if (toMinutes(newStart) > toMinutes(newEnd)) {
                alert('始業時刻が終業時刻より遅くなっています');
                return;
            }
            if (updateLog(originalDate, newDate, newStart, newEnd)) {
                editDialog.close();
                updateSummary();
            }
        });


        function downloadLogs() {
            const csv = restoreLogsIfNeeded();
            if (!csv) {
                alert('ログはありません');
                return;
            }
            const rawLines = csv.split('\n').filter(line => line);
            const daily = {};
            rawLines.forEach(line => {
                const parts = line.split(',');
                if (parts.length < 5) return;
                const [date, start, end, work, overtime] = parts;
                daily[date] = { start, end, work, overtime };
            });
            let totalWork = 0;
            let totalOvertime = 0;
            Object.keys(daily).forEach(d => {
                const { work, overtime } = daily[d];
                totalWork += parseFloat(work) || 0;
                totalOvertime += parseFloat(overtime) || 0;
            });
            const sortedDates = Object.keys(daily).sort();
            const rangeStart = formatDateWithDay(sortedDates[0]);
            const rangeEnd = formatDateWithDay(sortedDates[sortedDates.length - 1]);
            if (!confirm(`期間: ${rangeStart} 〜 ${rangeEnd}\n\nこの期間のCSVをダウンロードしますか？`)) {
                return;
            }
            const lines = [...rawLines];
            lines.push(`Total,,,${totalWork.toFixed(2)},${totalOvertime.toFixed(2)}`);
            const header = 'Date,Start,End,Work Hours,Overtime\n';
            const blob = new Blob([header + lines.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'logs.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function showMonthlyLogs(year, month) {
            logBody.innerHTML = '';
            const csv = restoreLogsIfNeeded();
            if (!csv) {
                renderEmptyState();
                return;
            }

            const daily = {};
            csv.split('\n').forEach(line => {
                if (!line) return;
                const parts = line.split(',');
                const date = parts[0];
                const start = parts[1];
                const end = parts[2];
                const work = parts[3];
                const overtime = parts[4];
                const b1s = parts[5] || '';
                const b1e = parts[6] || '';
                const b2s = parts[7] || '';
                const b2e = parts[8] || '';
                const mailed = parts[MAILED_INDEX] || '';
                const d = new Date(date);
                if (d.getFullYear() === year && d.getMonth() + 1 === month) {
                    daily[date] = { start, end, work, overtime, b1s, b1e, b2s, b2e, mailed };
                }
            });

            const rows = Object.keys(daily).map(d => ({ date: d, ...daily[d] }))
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            if (rows.length === 0) {
                renderEmptyState();
                return;
            }

            rows.forEach(r => {
                const rowEl = createRow(r.date, r.start, r.end, r.work, r.overtime,
                    r.b1s, r.b1e, r.b2s, r.b2e, r.mailed);
                logBody.appendChild(rowEl);
            });
        }

        function showMonthlySummary(year, month) {
            const csv = restoreLogsIfNeeded();
            if (!csv) {
                alert('ログはありません');
                return;
            }
            const dailyRecords = {};
            csv.trim().split('\n').forEach(line => {
                const parsed = parseLogLine(line);
                if (!parsed) return;
                const parts = parsed.split(',');
                const dateStr = parts[0];
                const hours = parseFloat(parts[3]) || 0;
                dailyRecords[dateStr] = { date: new Date(dateStr), hours: hours };
            });

            const records = Object.values(dailyRecords).filter(r => {
                return r.date.getFullYear() === year && r.date.getMonth() + 1 === month;
            });

            const totalHours = records.reduce((sum, rec) => sum + rec.hours, 0);

            const workingDays = records.length;
            const base = workingDays * 7.75;
            const overtime = totalHours - base;
            document.getElementById('stat-days').innerHTML = `${workingDays}<span class="stat-unit"> 日</span>`;
            document.getElementById('stat-hours').innerHTML = `${totalHours.toFixed(2)}<span class="stat-unit">h</span>`;
            document.getElementById('stat-overtime').innerHTML = `${overtime.toFixed(2)}<span class="stat-unit">h</span>`;
        }


        function updateSummary() {
            updateUndoState();
            const value = document.getElementById('summary-month').value;
            if (!value) return;
            const [y, m] = value.split('-').map(Number);
            showMonthlyLogs(y, m);
            showMonthlySummary(y, m);
        }

        summaryMonth.addEventListener('change', updateSummary);
        updateSummary();

    });

    /**
     * 更新要求を受け取ったら画面をリロードする。
     * @param {StorageEvent} e - storageイベント
     * @returns {void}
     */
    function handleRefreshRequest(e) {
        if (e.key === 'refreshLogs') {
            location.reload();
        }
    }

    window.addEventListener('storage', handleRefreshRequest);
    </script>
</body>
