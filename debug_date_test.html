<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日付欄デバッグ</title>
<style>
  body { margin: 0; padding: 20px; font-family: sans-serif; background: #222; color: #eee; }
  .box {
    border: 3px solid red;
    padding: 16px;
    margin-bottom: 20px;
    background: #333;
  }
  .box p { margin: 0 0 8px 0; font-size: 12px; color: #aaa; }
  input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <h3>このページの幅: <span id="w"></span>px</h3>

  <div class="box">
    <p>1. 何もCSSを当てていない素のinput type=date</p>
    <input type="date">
  </div>

  <div class="box">
    <p>2. 素のinput type=time</p>
    <input type="time">
  </div>

  <div class="box">
    <p>3. 比較用: input type=text（正常に見えるはずのもの）</p>
    <input type="text" value="テスト">
  </div>

  <script>
    document.getElementById('w').textContent = document.documentElement.clientWidth;
  </script>
</body>
</html>
