<body>
    <div id="refresh-indicator">更新中...</div>
    <div class="app-header">スマ勤サポートアプリ<span class="version">ver.1.18.6</span></div>

    <div class="button-group">
        <div class="main-buttons">
            <button id="submit-button">工数保存</button>
            <button id="email-button">メール作成</button>
            <button id="menu-button" class="icon-btn" aria-label="メニュー">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>
        </div>
        <div id="hamburger-menu" class="hamburger-menu">
            <a href="logs.html">ログ表示</a>
            <a href="due_logs.html">納期ログ表示</a>
            <button id="refresh-button">更新</button>
            <a href="settings.html">設定</a>
            <a href="backup.html">バックアップ</a>
            <button id="copy-task1-button">業務1コピー</button>
            <a href="manual.html">使い方</a>
            <div class="menu-font-size">
                <span class="menu-font-size-label">文字サイズ</span>
                <div class="font-size-toggle" id="font-size-toggle" role="group" aria-label="文字サイズ">
                    <button type="button" class="font-size-option" data-size="small">小</button>
                    <button type="button" class="font-size-option" data-size="medium">中</button>
                    <button type="button" class="font-size-option" data-size="large">大</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 勤務時間などの結果のカードは、スクロールしても「工数保存」の帯のすぐ下に残す -->
        <div class="sticky-summary">
            <div id="result" class="result summary-card"></div>
        </div>

        <div class="card">
            <!-- 日付・始業・終業を1行に並べる。見せる文字の上に透明な入力欄を重ね、押すとピッカーが開く -->
            <div class="datetime-row">
                <div class="input-group">
                    <label for="date"><span id="date-label-text">日付</span><span id="date-holiday" class="date-holiday"></span></label>
                    <div class="picker-box">
                        <span id="date-text" class="picker-text"></span>
                        <input type="date" id="date" name="date" class="picker-input" pattern="\d{4}-\d{2}-\d{2}">
                    </div>
                </div>
                <div class="input-group">
                    <label for="start-time">始業時刻</label>
                    <div class="picker-box">
                        <span id="start-time-text" class="picker-text"></span>
                        <input type="time" id="start-time" name="start-time" class="picker-input">
                    </div>
                </div>
                <div class="input-group">
                    <label for="end-time">終業時刻</label>
                    <div class="picker-box">
                        <span id="end-time-text" class="picker-text"></span>
                        <input type="time" id="end-time" name="end-time" class="picker-input">
                    </div>
                </div>
            </div>
            <details class="fold-section" id="interrupt-leave-section">
                <summary>中断時間・休暇の入力</summary>
                <div class="collapsible-body">
                    <div class="field-row">
                        <div class="input-group narrow">
                            <label for="break1-start">中断開始(1)</label>
                            <div class="picker-box">
                                <span class="picker-text"></span>
                                <input type="time" id="break1-start" name="break1-start" class="picker-input">
                            </div>
                        </div>
                        <div class="input-group narrow">
                            <label for="break1-end">中断終了(1)</label>
                            <div class="picker-box">
                                <span class="picker-text"></span>
                                <input type="time" id="break1-end" name="break1-end" class="picker-input">
                            </div>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="input-group narrow">
                            <label for="break2-start">中断開始(2)</label>
                            <div class="picker-box">
                                <span class="picker-text"></span>
                                <input type="time" id="break2-start" name="break2-start" class="picker-input">
                            </div>
                        </div>
                        <div class="input-group narrow">
                            <label for="break2-end">中断終了(2)</label>
                            <div class="picker-box">
                                <span class="picker-text"></span>
                                <input type="time" id="break2-end" name="break2-end" class="picker-input">
                            </div>
                        </div>
                    </div>
                    <div class="leave-toggles">
                        <label><input type="checkbox" id="annual-leave"> 年休</label>
                        <label><input type="checkbox" id="am-leave"> AM休</label>
                        <label><input type="checkbox" id="pm-leave"> PM休</label>
                    </div>
                </div>
            </details>
        </div>

        <!-- グループの入力ボックスを動的に追加するコンテナ -->
        <div id="task-groups-container"></div>

        <div class="card">
            <div class="input-group narrow">
                <label for="group-count">表示するグループの数</label>
                <select id="group-count" name="group-count">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
        </div>

        <div style="text-align: center; padding: 8px 0;">
            <a href="https://forms.gle/fbZW4GG91BBKUmkc9" target="_blank" style="font-size: 0.85em; color: var(--text-muted);">アンケートはこちら</a>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
