<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VK9M6SJ51F"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VK9M6SJ51F');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>スマ勤サポートアプリ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="https://smartkinmu.github.io/sumakin/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="https://smartkinmu.github.io/sumakin/icon-512x512.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="refresh-indicator">更新中...</div>
    <div class="app-header">スマ勤サポートアプリ<span class="version">ver.1.10.0</span></div>

    <div class="button-group">
        <div class="main-buttons">
            <button id="submit-button">入力確認</button>
            <button id="email-button">メール作成</button>
            <button id="menu-button" aria-label="メニュー">&#9776;</button>
        </div>
        <div id="hamburger-menu" class="hamburger-menu">
            <a href="logs.html">ログ表示</a>
            <a href="due_logs.html">納期ログ表示</a>
            <button id="refresh-button">更新</button>
            <a href="settings.html">休憩時間設定</a>
            <a href="backup.html">バックアップ</a>
            <button id="copy-task1-button">業務1コピー</button>
            <a href="manual.html" target="_blank">使い方</a>
            <div class="menu-font-size">
                <span class="menu-font-size-label">文字サイズ</span>
                <div class="font-size-toggle" id="font-size-toggle" role="group" aria-label="文字サイズ">
                    <button type="button" class="font-size-option" data-size="small">小</button>
                    <button type="button" class="font-size-option" data-size="medium">中</button>
                    <button type="button" class="font-size-option" data-size="large">大</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="result" class="result"></div>

        <div class="card">
            <div class="input-group">
                <label for="email">宛先メールアドレス</label>
                <input type="email" id="email" name="email" value="mail@address.com">
            </div>
        </div>

        <div class="card">
            <div class="input-group narrow">
                <label for="date">日付</label>
                <input type="date" id="date" name="date" pattern="\d{4}-\d{2}-\d{2}">
            </div>
            <div class="field-row">
                <div class="input-group narrow">
                    <label for="start-time">始業時刻</label>
                    <input type="time" id="start-time" name="start-time">
                </div>
                <div class="input-group narrow">
                    <label for="end-time">終業時刻</label>
                    <input type="time" id="end-time" name="end-time">
                </div>
            </div>
            <details class="fold-section" id="interrupt-leave-section">
                <summary>中断時間・休暇の入力</summary>
                <div class="collapsible-body">
                    <div class="field-row">
                        <div class="input-group narrow">
                            <label for="break1-start">中断開始(1)</label>
                            <input type="time" id="break1-start" name="break1-start">
                        </div>
                        <div class="input-group narrow">
                            <label for="break1-end">中断終了(1)</label>
                            <input type="time" id="break1-end" name="break1-end">
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="input-group narrow">
                            <label for="break2-start">中断開始(2)</label>
                            <input type="time" id="break2-start" name="break2-start">
                        </div>
                        <div class="input-group narrow">
                            <label for="break2-end">中断終了(2)</label>
                            <input type="time" id="break2-end" name="break2-end">
                        </div>
                    </div>
                    <div class="leave-toggles">
                        <label><input type="checkbox" id="annual-leave"> 年休</label>
                        <label><input type="checkbox" id="am-leave"> AM休</label>
                        <label><input type="checkbox" id="pm-leave"> PM休</label>
                    </div>
                </div>
            </details>
        </div>

        <!-- グループの入力ボックスを動的に追加するコンテナ -->
        <div id="task-groups-container"></div>

        <div class="card">
            <div class="input-group narrow">
                <label for="group-count">表示するグループの数</label>
                <select id="group-count" name="group-count">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
        </div>

        <div style="text-align: center; padding: 8px 0;">
            <a href="https://forms.gle/fbZW4GG91BBKUmkc9" target="_blank" style="font-size: 0.85em; color: var(--text-muted);">アンケートはこちら</a>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
