<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>納期ログ表示</title>
    <link rel="stylesheet" href="styles.css">
    <!-- どの画面から「ホーム画面に追加」しても、同じアイコンと名前になるようにする -->
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
</head>
<body>
    <div id="refresh-indicator">更新中...</div>
    <!-- 右上は「元に戻す」とメニューだけにする。ほかの操作は、入力画面と同じ形のメニューに入れる -->
    <div class="topbar">
        <a href="index.html" class="icon-btn" aria-label="戻る">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>納期ログ表示</h1>
        <button id="undo-delete-btn" class="icon-btn" aria-label="元に戻す">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="menu-button" class="icon-btn" aria-label="メニュー">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div id="hamburger-menu" class="hamburger-menu">
            <button id="refresh-button" type="button">更新</button>
            <button id="download-logs" type="button">CSVダウンロード</button>
            <button id="verify-logs-btn" type="button">計算チェック</button>
            <div class="menu-divider"></div>
            <button id="clear-logs" type="button" class="danger">すべて削除</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="field-row">
                <div class="input-group narrow">
                    <label for="due-start">開始日</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="date" id="due-start" class="picker-input">
                    </div>
                </div>
                <div class="input-group narrow">
                    <label for="due-end">終了日</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="date" id="due-end" class="picker-input">
                    </div>
                </div>
            </div>
            <div id="due-display"></div>
        </div>

        <div class="card summary-card">
            <div class="stat-row">
                <div class="stat-tile">
                    <div class="stat-label">勤務日数</div>
                    <div class="stat-value" id="stat-days">-<span class="stat-unit"> 日</span></div>
                </div>
                <div class="stat-tile">
                    <div class="stat-label">合計時間</div>
                    <div class="stat-value" id="stat-hours">-<span class="stat-unit">h</span></div>
                </div>
                <div class="stat-tile" id="stat-overtime-tile">
                    <div class="stat-label">残業</div>
                    <div class="stat-value" id="stat-overtime">-<span class="stat-unit">h</span></div>
                </div>
            </div>
        </div>

        <div id="log-body"></div>
    </div>

    <dialog id="edit-dialog" tabindex="-1">
        <form method="dialog" id="edit-form">
            <div class="input-group">
                <label for="edit-date">日付</label>
                <div class="picker-box">
                    <span class="picker-text"></span>
                    <input type="date" id="edit-date" class="picker-input">
                </div>
            </div>
            <div class="field-row">
                <div class="input-group narrow">
                    <label for="edit-start">始業</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="time" id="edit-start" class="picker-input">
                    </div>
                </div>
                <div class="input-group narrow">
                    <label for="edit-end">終業</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="time" id="edit-end" class="picker-input">
                    </div>
                </div>
            </div>
            <div class="edit-actions">
                <button id="edit-save" type="submit">保存</button>
                <button id="edit-delete" type="button" class="btn-outline danger">削除</button>
                <button id="edit-cancel" type="button" class="btn-muted">キャンセル</button>
            </div>
            <button id="edit-to-input" type="button" class="btn-outline">入力画面に戻す</button>
        </form>
    </dialog>
    <script src="common.js"></script>
    <script src="logs-page.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const dueStart = document.getElementById('due-start');
        const dueEnd = document.getElementById('due-end');
        const dueDisplay = document.getElementById('due-display');
        const todayDate = new Date();
        const futureDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate() + 30);
        dueStart.value = localStorage.getItem('dueStart') || formatYmd(todayDate);
        dueEnd.value = localStorage.getItem('dueEnd') || formatYmd(futureDate);

        /**
         * 開始日が終了日より後のときだけ、注意を出す。
         * 0件になる理由が分からないため、その場で知らせる（期間そのものは日付の欄に曜日付きで出ている）。
         * @returns {void}
         */
        function updateDueDisplay() {
            dueDisplay.textContent = dueStart.value && dueEnd.value && dueStart.value > dueEnd.value
                ? '開始日が終了日より後になっています'
                : '';
        }

        initLogPage({
            setup(onChange) {
                dueStart.addEventListener('change', onChange);
                dueEnd.addEventListener('change', onChange);
            },
            getRange() {
                if (!dueStart.value || !dueEnd.value) return null;
                return { start: dueStart.value, end: dueEnd.value };
            },
            // 期間の画面のCSVは、選んだ期間のログだけを出す
            getCsvRange() {
                return { start: dueStart.value || undefined, end: dueEnd.value || undefined };
            },
            afterUpdate() {
                localStorage.setItem('dueStart', dueStart.value);
                localStorage.setItem('dueEnd', dueEnd.value);
                updateDueDisplay();
            },
        });
        updateDueDisplay();
    });
    </script>
</body>
</html>
