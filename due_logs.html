<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>納期ログ表示</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px 6px 20px;
        }
        .topbar .icon-btn {
            width: 36px;
            height: 36px;
            min-width: 36px;
            flex: none;
            padding: 0;
            background: var(--surface-muted);
            color: var(--text);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .topbar .icon-btn.danger { color: var(--danger); }
        .topbar h1 {
            font-size: 1.176rem;
            font-weight: 700;
            margin: 0;
            flex-grow: 1;
        }
        /* flexコンテナ内だとSafariでネイティブのdate入力欄が崩れるため
           ブロックレイアウト(縦積み)にする */
        .due-range-row {
            display: block;
        }
        .due-range-row .input-group {
            margin-top: 10px;
        }
        .due-range-row .input-group:first-child {
            margin-top: 0;
        }
        .due-range-row input[type="date"] {
            display: block;
            border: none;
            background: var(--surface-muted);
            border-radius: var(--radius-sm);
            padding: 10px 10px;
            font-size: 0.882rem;
            color: var(--text);
            width: 100%;
            box-sizing: border-box;
        }
        #due-display {
            font-size: 0.824rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-row {
            display: flex;
            gap: 8px;
        }
        .stat-tile {
            flex: 1;
            background: var(--accent-soft);
            border-radius: var(--radius-md);
            padding: 11px 12px;
        }
        .stat-tile .stat-label {
            font-size: 0.706rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .stat-tile .stat-value {
            font-size: 1.176rem;
            font-weight: 800;
            color: var(--text);
        }
        .stat-tile .stat-unit {
            font-size: 0.765rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        #log-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .log-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
        }
        .log-card .log-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .log-card .log-date {
            font-size: 0.941rem;
            font-weight: 700;
        }
        .log-card .log-dow {
            font-size: 0.765rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 6px;
        }
        .log-card .mail-mark {
            display: inline-flex;
            vertical-align: middle;
            margin-left: 7px;
            color: var(--accent);
        }
        .log-card .edit-btn {
            width: 30px;
            height: 30px;
            min-width: 30px;
            padding: 0;
            background: var(--surface-muted);
            border-radius: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.882rem;
            box-shadow: none;
        }
        .log-card .log-mid {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .log-card .log-times {
            font-size: 0.824rem;
            color: var(--text-muted);
        }
        .log-card .chip {
            font-size: 0.765rem;
            font-weight: 700;
            color: var(--text);
            background: var(--surface-muted);
            border-radius: 8px;
            padding: 4px 9px;
            margin-left: auto;
        }
        .log-card .chip.overtime {
            color: var(--overtime-text);
            background: var(--overtime-bg);
        }
        /* 残業がマイナス（勤務時間が不足）の場合は赤で示す。プラスと同じ重みにする */
        .log-card .chip.short {
            color: var(--short-text);
            background: var(--short-bg);
        }
        .log-card .log-sub {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            font-size: 0.765rem;
            color: var(--text-muted);
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.882rem;
            padding: 30px 0;
        }
        dialog#edit-dialog {
            border: none;
            border-radius: var(--radius-lg);
            padding: 18px;
            background: var(--surface);
            color: var(--text);
            width: min(320px, 90vw);
        }
        dialog#edit-dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
        }
        /* flexコンテナ内だとSafariでネイティブのdate/time入力欄が崩れるため
           ブロックレイアウト(縦積み)にする */
        #edit-form {
            display: block;
        }
        #edit-form > * {
            margin-top: 12px;
        }
        #edit-form > *:first-child {
            margin-top: 0;
        }
        #edit-form .input-group label {
            display: block;
            margin-bottom: 6px;
        }
        #edit-form .input-group input {
            width: 100%;
        }
        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .edit-actions button {
            flex: 1;
            padding: 10px 0;
        }
        #edit-delete {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }
        #edit-cancel {
            background: var(--surface-muted);
            color: var(--text);
        }
        /* メールを作り直すときに使う。保存・削除と取り違えないよう、控えめな見た目で1行に置く */
        #edit-to-input {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="refresh-indicator">更新中...</div>
    <div class="topbar">
        <a href="index.html" class="icon-btn" aria-label="戻る">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>納期ログ表示</h1>
        <button id="refresh-button" class="icon-btn" aria-label="更新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
        <button id="download-logs" class="icon-btn" aria-label="CSVダウンロード">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 19h14"/></svg>
        </button>
        <button id="verify-logs-btn" class="icon-btn" aria-label="計算チェック">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
        <button id="clear-logs" class="icon-btn danger" aria-label="ログをクリア">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg>
        </button>
        <button id="undo-delete-btn" class="icon-btn" aria-label="UNDO">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
    </div>

    <div class="container">
        <div class="card">
            <div class="due-range-row">
                <div class="input-group narrow">
                    <label for="due-start">開始日</label>
                    <input type="date" id="due-start">
                </div>
                <div class="input-group narrow">
                    <label for="due-end">終了日</label>
                    <input type="date" id="due-end">
                </div>
            </div>
            <div id="due-display"></div>
        </div>

        <div class="stat-row">
            <div class="stat-tile">
                <div class="stat-label">勤務日数</div>
                <div class="stat-value" id="stat-days">-<span class="stat-unit"> 日</span></div>
            </div>
            <div class="stat-tile">
                <div class="stat-label">合計時間</div>
                <div class="stat-value" id="stat-hours">-<span class="stat-unit">h</span></div>
            </div>
            <div class="stat-tile">
                <div class="stat-label">残業</div>
                <div class="stat-value" id="stat-overtime">-<span class="stat-unit">h</span></div>
            </div>
        </div>
        <p id="monthly-summary" style="display:none;"></p>

        <div id="log-body"></div>
    </div>

    <dialog id="edit-dialog" tabindex="-1">
        <form method="dialog" id="edit-form">
            <div class="input-group">
                <label for="edit-date">日付</label>
                <input type="date" id="edit-date">
            </div>
            <div class="input-group">
                <label for="edit-start">始業</label>
                <input type="time" id="edit-start">
            </div>
            <div class="input-group">
                <label for="edit-end">終業</label>
                <input type="time" id="edit-end">
            </div>
            <div class="edit-actions">
                <button id="edit-save" type="submit">保存</button>
                <button id="edit-delete" type="button">削除</button>
                <button id="edit-cancel" type="button">キャンセル</button>
            </div>
            <button id="edit-to-input" type="button">入力画面に戻す</button>
        </form>
    </dialog>
    <script src="common.js"></script>
    <script src="logs-page.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const dueStart = document.getElementById('due-start');
        const dueEnd = document.getElementById('due-end');
        const dueDisplay = document.getElementById('due-display');
        const todayDate = new Date();
        const pad = n => String(n).padStart(2, '0');
        const formatYmd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const futureDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate() + 30);
        dueStart.value = localStorage.getItem('dueStart') || formatYmd(todayDate);
        dueEnd.value = localStorage.getItem('dueEnd') || formatYmd(futureDate);

        /**
         * YYYY-MM-DD を「2026年10月14日(水)」の形にする。
         * @param {string} d - YYYY-MM-DD
         * @returns {string} 表示用の日付
         */
        function formatJp(d) {
            const date = parseDateLocal(d);
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            return `${date.getFullYear()}年${pad(date.getMonth() + 1)}月${pad(date.getDate())}日(${days[date.getDay()]})`;
        }

        function updateDueDisplay() {
            if (dueStart.value && dueEnd.value) {
                // 開始と終了が逆だと0件になるが理由が分からないため、その場で知らせる
                if (dueStart.value > dueEnd.value) {
                    dueDisplay.textContent = '開始日が終了日より後になっています';
                    return;
                }
                dueDisplay.textContent = `${formatJp(dueStart.value)}〜${formatJp(dueEnd.value)}`;
            }
        }

        initLogPage({
            setup(onChange) {
                dueStart.addEventListener('change', onChange);
                dueEnd.addEventListener('change', onChange);
            },
            getRange() {
                if (!dueStart.value || !dueEnd.value) return null;
                return { start: dueStart.value, end: dueEnd.value };
            },
            // 期間の画面のCSVは、選んだ期間のログだけを出す
            getCsvRange() {
                return { start: dueStart.value || undefined, end: dueEnd.value || undefined };
            },
            afterUpdate() {
                localStorage.setItem('dueStart', dueStart.value);
                localStorage.setItem('dueEnd', dueEnd.value);
                updateDueDisplay();
            },
        });
        updateDueDisplay();
    });
    </script>
</body>
</html>
