<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>バックアップ</title>
    <link rel="stylesheet" href="styles.css">
    <!-- どの画面から「ホーム画面に追加」しても、同じアイコンと名前になるようにする -->
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
</head>
<body>
    <div id="refresh-indicator">更新中...</div>
    <div class="topbar">
        <a href="index.html" class="icon-btn" aria-label="戻る">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>バックアップ</h1>
        <button id="refresh-button" class="icon-btn" aria-label="更新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
    </div>

    <div class="container">
        <div class="card">
            <h2 class="card-title">書き出し</h2>
            <p>ログ・設定・業務内容をまとめて1つのファイルに保存します。ホーム画面からアプリを削除するとデータも消えるため、定期的な保存をおすすめします。</p>
            <div class="note" id="backup-status">まだバックアップしていません</div>
            <button id="export-button">バックアップを書き出す</button>
        </div>

        <div class="card">
            <h2 class="card-title">読み込み</h2>
            <p>書き出したファイルを選ぶと、その時点の内容に戻します。現在のデータは、ファイルの内容に置き換わります。</p>
            <!-- ファイルの種類は絞らない。古いAndroidはJSONという種類を知らず、絞ると書き出したファイルを選べなくなるため。
                 中身は読み込むときに確かめる（isValidBackup） -->
            <input type="file" id="restore-file" hidden>
            <button id="restore-button" class="btn-outline">バックアップから復元</button>
        </div>

        <div class="card" id="undo-restore-card" style="display:none;">
            <h2 class="card-title">復元の取り消し</h2>
            <p id="undo-restore-text">直前の復元を取り消して、復元する前の内容に戻します。ログを保存・編集すると、取り消せなくなります。</p>
            <button id="undo-restore-button">復元を取り消す</button>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const exportButton = document.getElementById('export-button');
            const restoreButton = document.getElementById('restore-button');
            const restoreFile = document.getElementById('restore-file');
            const backupStatus = document.getElementById('backup-status');
            const undoRestoreCard = document.getElementById('undo-restore-card');
            const undoRestoreButton = document.getElementById('undo-restore-button');

            // 「更新」ボタンと画面を下に引く操作で、最新版を取得する
            document.getElementById('refresh-button').addEventListener('click', refreshApp);
            setupPullToRefresh();

            /**
             * 最終バックアップ日時の表示を更新する。
             * @returns {void}
             */
            function updateStatus() {
                const saved = localStorage.getItem('lastBackupAt');
                const logs = parseLogsToMap(localStorage.getItem('logs'));
                if (!saved) {
                    backupStatus.textContent = `まだバックアップしていません（現在のログ: ${logs.size}件）`;
                    return;
                }
                backupStatus.textContent =
                    `最終バックアップ: ${formatDateTime(new Date(saved))}（現在のログ: ${logs.size}件）`;
            }

            /**
             * 復元を取り消せるときだけ、取り消しの欄を出す。
             * （.card は display を指定しているため、hidden 属性ではなく style で切り替える）
             * @returns {void}
             */
            function updateUndoRestore() {
                undoRestoreCard.style.display = getRestoreUndoTime() ? 'block' : 'none';
            }

            /**
             * バックアップファイルを書き出す。
             * 共有シート(navigator.share)が使える場合はそちらを優先し、
             * 使えない場合はダウンロードで保存する。
             * @returns {Promise<void>}
             */
            async function exportBackup() {
                const backup = createBackup();
                const text = JSON.stringify(backup, null, 2);
                const now = new Date();
                const stamp = formatYmd(now);
                const filename = `sumakin-backup-${stamp}.json`;
                const file = new File([text], filename, { type: 'application/json' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: 'スマ勤バックアップ' });
                    } catch (error) {
                        // ユーザーが共有をキャンセルした場合は何もしない
                        if (error.name === 'AbortError') return;
                        throw error;
                    }
                } else {
                    downloadFile(new Blob([text], { type: 'application/json' }), filename);
                }
                localStorage.setItem('lastBackupAt', new Date().toISOString());
                updateStatus();
            }

            /**
             * 選択されたバックアップファイルを読み込んで復元する。
             * @param {File} file - 選択されたファイル
             * @returns {Promise<void>}
             */
            async function restoreFromFile(file) {
                let backup;
                try {
                    backup = JSON.parse(await file.text());
                } catch (error) {
                    alert('ファイルを読み込めませんでした。バックアップファイルを選んでください。');
                    return;
                }
                if (!isValidBackup(backup)) {
                    alert('スマ勤のバックアップファイルではありません。');
                    return;
                }
                const currentLogs = parseLogsToMap(localStorage.getItem('logs'));
                const message = `以下の内容に復元します。\n\n${summarizeBackup(backup).join('\n')}\n\n`
                    + `現在のデータ（ログ${currentLogs.size}件と設定）は、ファイルの内容に置き換わります。`
                    + '復元したあとは、この画面の「復元を取り消す」で元に戻せます。\n\n復元しますか？';
                if (!confirm(message)) {
                    return;
                }
                restoreBackup(backup);
                alert('復元しました。');
                location.href = 'index.html';
            }

            exportButton.addEventListener('click', () => {
                exportBackup().catch(() => alert('書き出しに失敗しました。'));
            });
            restoreButton.addEventListener('click', () => restoreFile.click());
            restoreFile.addEventListener('change', () => {
                const file = restoreFile.files[0];
                if (file) {
                    restoreFromFile(file).catch(() => {
                        alert('復元に失敗しました。「復元を取り消す」で元に戻してください。');
                        updateUndoRestore();
                    });
                }
                restoreFile.value = '';
            });

            undoRestoreButton.addEventListener('click', () => {
                const at = getRestoreUndoTime();
                const when = at ? formatDateTime(at) : '直前';
                if (!confirm(`${when} の復元を取り消して、復元する前の内容に戻しますか？\n復元のあとに変えた設定も、復元する前の内容に戻ります。`)) {
                    return;
                }
                if (undoRestore()) {
                    alert('復元する前の内容に戻しました。');
                    location.href = 'index.html';
                } else {
                    alert('取り消せる復元はありません。');
                    updateUndoRestore();
                }
            });

            updateStatus();
            updateUndoRestore();
        });
    </script>
</body>
</html>
