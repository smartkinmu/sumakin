<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>設定</title>
    <link rel="stylesheet" href="styles.css">
    <!-- どの画面から「ホーム画面に追加」しても、同じアイコンと名前になるようにする -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
    <div id="refresh-indicator">更新中...</div>
    <div class="topbar">
        <a href="index.html" class="icon-btn" aria-label="戻る">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>設定</h1>
        <button id="refresh-button" class="icon-btn" aria-label="更新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
    </div>
    <div class="container">
        <div class="card">
            <h2 class="card-title">メール</h2>
            <div class="input-group">
                <label for="email">宛先メールアドレス</label>
                <input type="email" id="email" placeholder="reporting@example.com">
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">休憩時間</h2>
            <div class="field-row">
                <div class="input-group narrow">
                    <label for="lunch-start">昼休み開始</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="time" id="lunch-start" class="picker-input">
                    </div>
                </div>
                <div class="input-group narrow">
                    <label for="lunch-end">昼休み終了</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="time" id="lunch-end" class="picker-input">
                    </div>
                </div>
            </div>
            <div class="field-row">
                <div class="input-group narrow">
                    <label for="evening-start">夕休み開始</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="time" id="evening-start" class="picker-input">
                    </div>
                </div>
                <div class="input-group narrow">
                    <label for="evening-end">夕休み終了</label>
                    <div class="picker-box">
                        <span class="picker-text"></span>
                        <input type="time" id="evening-end" class="picker-input">
                    </div>
                </div>
            </div>
        </div>
        <button id="save-settings">保存</button>
    </div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            const lunchStart = document.getElementById('lunch-start');
            const lunchEnd = document.getElementById('lunch-end');
            const eveningStart = document.getElementById('evening-start');
            const eveningEnd = document.getElementById('evening-end');
            const saveBtn = document.getElementById('save-settings');

            // 「更新」ボタンと画面を下に引く操作で、最新版を取得する
            document.getElementById('refresh-button').addEventListener('click', refreshApp);
            setupPullToRefresh();

            // date/time入力欄の実際のpx幅を測定して明示指定する（Safari対策）
            fixNativeInputWidths();
            window.addEventListener('resize', () => fixNativeInputWidths());

            /**
             * ローカルストレージから設定を読み込む。
             * @returns {void}
             */
            function load() {
                emailInput.value = localStorage.getItem('email') || '';
                lunchStart.value = localStorage.getItem('break1Start') || '12:00';
                lunchEnd.value = localStorage.getItem('break1End') || '13:00';
                eveningStart.value = localStorage.getItem('break2Start') || '19:15';
                eveningEnd.value = localStorage.getItem('break2End') || '19:45';
            }

            /**
             * 入力された設定を保存する。
             * @returns {void}
             */
            function save() {
                // 開始と終了が逆だと休憩時間が負になり、以降の勤務時間計算がすべて狂う
                const errors = [];
                // 未設定のままにはできるが、入力されている場合は形式を確認する
                if (emailInput.value && !isValidEmail(emailInput.value)) {
                    errors.push('宛先メールアドレスの形式が正しくありません。');
                }
                if (!lunchStart.value || !lunchEnd.value || !eveningStart.value || !eveningEnd.value) {
                    errors.push('すべての時刻を入力してください。');
                } else {
                    if (toMinutes(lunchStart.value) >= toMinutes(lunchEnd.value)) {
                        errors.push('昼休みの開始が終了より後になっています。');
                    }
                    if (toMinutes(eveningStart.value) >= toMinutes(eveningEnd.value)) {
                        errors.push('夕休みの開始が終了より後になっています。');
                    }
                    // 重なっていると、画面によって勤務時間の計算が食い違う原因になる
                    if (Math.max(toMinutes(lunchStart.value), toMinutes(eveningStart.value))
                        < Math.min(toMinutes(lunchEnd.value), toMinutes(eveningEnd.value))) {
                        errors.push('昼休みと夕休みの時間が重なっています。');
                    }
                }
                if (errors.length > 0) {
                    alert(errors.join('\n'));
                    return;
                }
                localStorage.setItem('email', emailInput.value);
                localStorage.setItem('break1Start', lunchStart.value);
                localStorage.setItem('break1End', lunchEnd.value);
                localStorage.setItem('break2Start', eveningStart.value);
                localStorage.setItem('break2End', eveningEnd.value);
                alert('保存しました');
            }

            saveBtn.addEventListener('click', save);
            load();
            // 読み込んだ時刻を、日付・時刻の箱に出す
            setupPickerBoxes();
        });
    </script>
</body>
</html>
