<!DOCTYPE html>
<html lang="ja">
<head>
    <script>document.documentElement.setAttribute('data-font-size', localStorage.getItem('fontSize') || 'small');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休憩時間設定</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px 8px 20px;
        }
        .topbar .icon-btn {
            width: 36px;
            height: 36px;
            min-width: 36px;
            flex: none;
            padding: 0;
            background: var(--surface-muted);
            color: var(--text);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .topbar h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="icon-btn" aria-label="戻る">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>休憩時間設定</h1>
    </div>
    <div class="container">
        <div class="card">
            <div class="input-group">
                <label for="lunch-start">昼休み開始</label>
                <input type="time" id="lunch-start">
            </div>
            <div class="input-group">
                <label for="lunch-end">昼休み終了</label>
                <input type="time" id="lunch-end">
            </div>
            <div class="input-group">
                <label for="evening-start">夕休み開始</label>
                <input type="time" id="evening-start">
            </div>
            <div class="input-group">
                <label for="evening-end">夕休み終了</label>
                <input type="time" id="evening-end">
            </div>
        </div>
        <button id="save-settings">保存</button>
    </div>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lunchStart = document.getElementById('lunch-start');
            const lunchEnd = document.getElementById('lunch-end');
            const eveningStart = document.getElementById('evening-start');
            const eveningEnd = document.getElementById('evening-end');
            const saveBtn = document.getElementById('save-settings');

            // date/time入力欄の実際のpx幅を測定して明示指定する（Safari対策）
            fixNativeInputWidths();
            window.addEventListener('resize', () => fixNativeInputWidths());

            /**
             * ローカルストレージから休憩時間設定を読み込む。
             * @returns {void}
             */
            function load() {
                lunchStart.value = localStorage.getItem('break1Start') || '12:00';
                lunchEnd.value = localStorage.getItem('break1End') || '13:00';
                eveningStart.value = localStorage.getItem('break2Start') || '19:15';
                eveningEnd.value = localStorage.getItem('break2End') || '19:45';
            }

            /**
             * 入力された休憩時間を保存する。
             * @returns {void}
             */
            function save() {
                localStorage.setItem('break1Start', lunchStart.value);
                localStorage.setItem('break1End', lunchEnd.value);
                localStorage.setItem('break2Start', eveningStart.value);
                localStorage.setItem('break2End', eveningEnd.value);
                alert('保存しました');
            }

            saveBtn.addEventListener('click', save);
            load();
        });
    </script>
</body>
</html>
